persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Default unauthenticated access disabled in production; enable anonymous for demo testing if needed
allow_anonymous true

listener 1883 0.0.0.0

# WebSocket listener for monitoring tools
listener 9001 0.0.0.0
protocol websockets

# Access Control List
acl_file /mosquitto/config/aclfile
